<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <script type="module" src="../global.js"></script>
    <title>Meta</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body > h2 {
        text-align: center;
      }

      .summary {
        border: 1px solid #d2d2d2;
        background: #f2f2f2;
        padding: 10px 14px 14px;
      }

      .summary h2 {
        margin: 0 0 0.5rem;
        line-height: 1.1;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }

      .summary-item {
        min-width: 0;
      }

      .summary-label {
        margin: 0;
        font-size: 10px;
        color: #6d7075;
        letter-spacing: 0.04em;
      }

      .summary-value {
        margin: 2px 0 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1;
        color: #111;
      }

      #chart {
        margin-top: 12px;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      #chart svg {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
      }

      .gridlines .tick line {
        stroke: #c8ccd0;
        stroke-opacity: 0.45;
        stroke-width: 1;
        shape-rendering: crispEdges;
      }

      .gridlines path {
        display: none;
      }

      .axis path,
      .axis line {
        stroke: #333;
      }

      .axis text {
        fill: #333;
        font-size: 12px;
      }

      dl.info {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 0.75rem;
        row-gap: 0.35rem;
        margin: 0;
        transition-duration: 500ms;
        transition-property: opacity, visibility;
      }

      dl.info[hidden]:not(:hover, :focus-within) {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      dl.info.tooltip[hidden] {
        display: grid;
      }

      dl.info dt,
      dl.info dd {
        margin: 0;
      }

      dl.info dt {
        font-size: 0.8rem;
        font-weight: 500;
        color: #6d7075;
        letter-spacing: 0.02em;
      }

      dl.info dd {
        font-size: 0.95rem;
        font-weight: 600;
        color: #111;
      }

      .tooltip {
        position: fixed;
        z-index: 1000;
        max-width: min(90vw, 22rem);
        padding: 0.65rem 0.85rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 10px;
        box-shadow:
          0 4px 18px rgba(0, 0, 0, 0.1),
          0 1px 4px rgba(0, 0, 0, 0.06);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      circle {
        transition: 200ms;
        transform-origin: center;
        transform-box: fill-box;
      }

      circle:hover {
        transform: scale(1.5);
      }

      circle.selected {
        fill: #ff6b6b;
      }

      @keyframes marching-ants {
        to {
          stroke-dashoffset: -8;
        }
      }

      .selection {
        fill-opacity: 0.1;
        stroke: black;
        stroke-opacity: 0.7;
        stroke-dasharray: 5 3;
        animation: marching-ants 2s linear infinite;
      }

      #selection-count {
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
        color: #45484c;
        text-align: center;
      }

      .language-breakdown {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 2rem 3.5rem;
        margin: 1rem 0 0;
      }

      .language-column {
        min-width: 6.5rem;
      }

      .language-name {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
        font-weight: 700;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #111;
      }

      .language-lines,
      .language-pct {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.9rem;
        font-weight: 400;
        color: #2f3134;
      }

      .language-pct {
        margin-top: 0.2rem;
      }
    </style>
  </head>
  <body>
    <div id="stats"></div>
    <script type="module" src="./main.js"></script>
    <h2>Commits by time of day</h2>
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    <div id="language-breakdown" class="language-breakdown" aria-live="polite"></div>
    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <!-- Add: Time, author, lines edited -->
    </dl>
      
  </body>
</html>
